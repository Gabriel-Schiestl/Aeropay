global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: payment-service
    static_configs:
      - targets: ["web:8080"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
